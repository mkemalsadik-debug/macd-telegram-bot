name: MACD Telegram Bot

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macd:
    runs-on: ubuntu-latest

    steps:
      - name: Repo'yu al
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Kutuphaneleri kur
        run: pip install requests pandas

      - name: MACD botu calistir
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        run: python macd_alert.py

      - name: Yeni state varsa kaydet
        run: |
          if git diff --quiet -- state.json; then
            echo "State degismedi."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add state.json
            git commit -m "Update MACD alert state"
            git push
          fi
